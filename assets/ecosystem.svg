<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="The technologies I use, organized across mobile, frontend, backend and data">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080C19"/><stop offset="1" stop-color="#0C1022"/></linearGradient>
<linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9B79EF"/><stop offset="1" stop-color="#58ECDC"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7188B0" stroke-opacity=".07"/></pattern>
<style><![CDATA[
@keyframes shine {from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.flow{animation:shine 4.5s linear infinite}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
]]></style>
</defs>
<rect width="1200" height="310" rx="24" fill="url(#bg)"/>
<rect width="1200" height="310" rx="24" fill="url(#grid)"/>
<circle cx="620" cy="155" r="155" fill="#6F4DDB" opacity=".095" filter="url(#blur)"/>
<text x="42" y="38" fill="#7B90B4" font-size="12" letter-spacing="3.0" font-family="Arial,sans-serif">ENGINEERING ECOSYSTEM</text>
<text x="1155" y="38" fill="#7B90B4" font-size="12" text-anchor="end" font-family="monospace">CONNECTED CAPABILITIES // 04</text>
<path d="M260 162H935" stroke="#283457" stroke-width="3"/>
<path d="M260 162H935" stroke="url(#wire)" stroke-width="2" stroke-dasharray="6 13" class="flow" opacity=".9"/>

